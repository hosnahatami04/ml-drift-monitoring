[project]
name = "driftmon"
version = "0.1.0"
description = "Drift detection and observability for production ML"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hosna Hatami" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pandas>=2.2",
    "pyarrow>=18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "typer>=0.15",
    "uvicorn>=0.32",
    "xgboost>=2.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "hypothesis>=6.100",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[project.scripts]
driftmon = "driftmon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftmon"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "xgboost.*", "pyarrow.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "data: needs the locally downloaded dataset and a trained artifact",
]

[tool.coverage.run]
source = ["driftmon"]

[tool.coverage.report]
show_missing = true
