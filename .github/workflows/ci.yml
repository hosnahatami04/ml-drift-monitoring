name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONHASHSEED: "0"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dependencies
        run: make setup
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Test
        run: make test
      - name: Validate compose file
        run: docker compose config --quiet
